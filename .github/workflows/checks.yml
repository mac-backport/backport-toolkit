name: checks
on: [push, pull_request]
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No private data (home paths, tailnet, tokens, passwords)
        run: |
          P='/Users/[a-z]+/|serengeti|\.ts\.net|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+|gh[ops]_[A-Za-z0-9]{20}|sk-ant-|SAPISID=|echo .[a-z]+. \| sudo|niceshops'
          if git ls-files -z | xargs -0 grep -nIE "$P" | grep -v '100\.64\.0\.0/10'; then
            echo "::error::private data found (see above)"; exit 1; fi
      - name: Portfile descriptions are ASCII (non-ASCII corrupts the overlay PortIndex)
        run: |
          bad=0
          for f in $(git ls-files 'ports/*/*/Portfile'); do
            if awk '/^(description|long_description)/{d=1} d{print FILENAME": "$0} d&&!/\\$/{d=0}' "$f" | LC_ALL=C grep -n '[^ -~]'; then bad=1; fi
          done
          exit $bad
      - name: No local file:// distfiles
        run: |
          if git ls-files 'ports/*/*/Portfile' | xargs grep -n 'file:///'; then
            echo "::error::Portfile fetches from a local path"; exit 1; fi
